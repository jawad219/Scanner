<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }
    body.dark { background: linear-gradient(135deg, #1f1f1f, #0d0d0d); color: white; }
    body.light { background: linear-gradient(135deg, #f0f0f0, #ffffff); color: #111; }

    .container { width: 90%; max-width: 400px; text-align: center; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .back-btn {
      background: #444;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }
    h2 { margin: 0; font-size: 20px; }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: white;
      font-size: 15px;
      margin-bottom: 12px;
    }
    body.light input { background: #fff; color: #111; border: 1px solid #ccc; }

    button {
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 12px;
    }

    #qrResult {
      background: white;
      padding: 20px;
      border-radius: 14px;
      display: inline-block;
      min-height: 50px;
      margin-bottom: 16px;
    }

    .action-row {
      display: flex;
      gap: 10px;
    }
    .action-row button {
      flex: 1;
      margin-bottom: 0;
    }
    .download-btn { background: #2196F3; }
    .share-btn { background: #9C27B0; }
    #actionButtons { display: none; }
  </style>
</head>
<body class="dark">
  <div class="container">
    <div class="header">
      <h2>✏️ QR Banao</h2>
      <a href="scanner.html" class="back-btn">⬅ Wapas</a>
    </div>

    <input type="text" id="qrText" placeholder="Link ya text daalo...">
    <button id="generateBtn">QR Code Banao</button>

    <div id="qrResult"></div>

    <div class="action-row" id="actionButtons">
      <button class="download-btn" id="downloadBtn">⬇️ Download</button>
      <button class="share-btn" id="shareBtn">📤 Share</button>
    </div>
  </div>

  <script>
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "index.html";
    }

    let savedTheme = localStorage.getItem("theme") || "dark";
    document.body.className = savedTheme;

    let qrcode = null;

    document.getElementById('generateBtn').addEventListener('click', function() {
      const text = document.getElementById('qrText').value.trim();
      const resultDiv = document.getElementById('qrResult');
      resultDiv.innerHTML = "";

      if (!text) {
        alert("Pehle kuch likho ya link daalo!");
        return;
      }

      qrcode = new QRCode(resultDiv, {
        text: text,
        width: 220,
        height: 220
      });

      // Thoda wait taake QR image ban jaye, phir buttons dikhao
      setTimeout(() => {
        document.getElementById('actionButtons').style.display = "flex";
      }, 300);
    });

    // ---------- Download ----------
    document.getElementById('downloadBtn').addEventListener('click', function() {
      const img = document.querySelector('#qrResult img');
      const canvas = document.querySelector('#qrResult canvas');

      let dataUrl;
      if (img) {
        dataUrl = img.src;
      } else if (canvas) {
        dataUrl = canvas.toDataURL("image/png");
      } else {
        alert("Pehle QR code banao!");
        return;
      }

      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = "my_qrcode.png";
      link.click();
    });

    // ---------- Share ----------
    document.getElementById('shareBtn').addEventListener('click', async function() {
      const canvas = document.querySelector('#qrResult canvas');
      const img = document.querySelector('#qrResult img');

      if (!canvas && !img) {
        alert("Pehle QR code banao!");
        return;
      }

      try {
        let blob;
        if (canvas) {
          blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
        } else {
          const response = await fetch(img.src);
          blob = await response.blob();
        }

        const file = new File([blob], "qrcode.png", { type: "image/png" });

        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: "QR Code",
            text: "Ye raha mera QR Code"
          });
        } else {
          alert("Is device/browser mein direct share support nahi hai. Download karke phir share karo.");
        }
      } catch (err) {
        console.log("Share error:", err);
      }
    });
  </script>
</body>
</html>
