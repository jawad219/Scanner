<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px 0;
      transition: 0.3s;
    }
    body.dark {
      background: linear-gradient(135deg, #1f1f1f, #0d0d0d);
      color: white;
    }
    body.light {
      background: linear-gradient(135deg, #f0f0f0, #ffffff);
      color: #111;
    }
    .container { width: 90%; max-width: 400px; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .header h2 { margin: 0; font-size: 20px; }
    .top-buttons { display: flex; gap: 8px; }
    .icon-btn {
      background: #444;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .logout-btn { background: #f44336; }

    .nav-links {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .nav-links a {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      background: #4CAF50;
      color: white;
    }

    .switch-group {
      display: flex;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 16px;
    }
    body.dark .switch-group { background: #1e1e1e; }
    body.light .switch-group { background: #e0e0e0; }
    .switch-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      color: #999;
    }
    .switch-btn.active { background: #4CAF50; color: white; }

    #reader-wrapper {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    body.dark #reader-wrapper { background: #1e1e1e; }
    body.light #reader-wrapper { background: #fff; }
    .scan-line {
      position: absolute;
      left: 0; width: 100%; height: 3px;
      background: #4CAF50;
      box-shadow: 0 0 8px 3px #4CAF50;
      animation: scanMove 2s infinite ease-in-out;
      z-index: 10;
      pointer-events: none;
    }
    @keyframes scanMove {
      0% { top: 2%; } 50% { top: 93%; } 100% { top: 2%; }
    }

    #fileBox {
      display: none;
      border-radius: 14px;
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      border: 2px dashed #666;
    }
    body.dark #fileBox { background: #1e1e1e; }
    body.light #fileBox { background: #fff; }
    #fileBox label {
      display: inline-block;
      background: #4CAF50;
      color: white;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-box {
      padding: 25px;
      border-radius: 14px;
      max-width: 320px;
      width: 85%;
      text-align: left;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    body.dark .modal-box { background: #1e1e1e; color: white; }
    body.light .modal-box { background: #fff; color: #111; }
    .modal-box h3 { margin-top: 0; color: #4CAF50; }
    .modal-box p { word-break: break-word; }
    .modal-btn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      margin-top: 15px;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
    }
    a { color: #4CAF50; }
  </style>
</head>
<body class="dark">
  <div class="container">
    <div class="header">
      <h2>📷 QR Scanner</h2>
      <div class="top-buttons">
        <button class="icon-btn" id="themeBtn">🌙</button>
        <button class="icon-btn logout-btn" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="nav-links">
      <a href="generator.html">✏️ QR Banao</a>
    </div>

    <div class="switch-group">
      <div class="switch-btn active" id="camModeBtn">📷 Camera</div>
      <div class="switch-btn" id="fileModeBtn">🖼️ File</div>
    </div>

    <div id="reader-wrapper">
      <div class="scan-line" id="scanLine"></div>
      <div id="reader"></div>
    </div>

    <div id="fileBox">
      <p>Gallery se QR image select karo</p>
      <label for="fileInput">📁 Image Select Karo</label>
      <input type="file" id="fileInput" accept="image/*" style="display:none;">
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h3 id="modalType">Type</h3>
      <p id="modalContent">Content</p>
      <div id="modalLink"></div>
      <button class="modal-btn" onclick="closeModal()">Dubara Scan Karo</button>
    </div>
  </div>

  <script>
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "index.html";
    }

    document.getElementById('logoutBtn').addEventListener('click', function() {
      localStorage.removeItem("loggedIn");
      window.location.href = "index.html";
    });

    // ---------- Theme Toggle ----------
    const themeBtn = document.getElementById('themeBtn');
    function applyTheme(theme) {
      document.body.className = theme;
      themeBtn.innerText = theme === "dark" ? "🌙" : "☀️";
      localStorage.setItem("theme", theme);
    }
    let savedTheme = localStorage.getItem("theme") || "dark";
    applyTheme(savedTheme);

    themeBtn.addEventListener('click', function() {
      const newTheme = document.body.className === "dark" ? "light" : "dark";
      applyTheme(newTheme);
    });

    // ---------- Vibration ----------
    function vibrateSuccess() {
      if (navigator.vibrate) {
        navigator.vibrate(200);
      }
    }

    // ---------- Scanner Logic ----------
    const html5QrCode = new Html5Qrcode("reader");
    let isPaused = false;
    let cameraRunning = false;
    let currentMode = "camera";

    function analyzeQR(text) {
      let type = "Plain Text";
      let linkHtml = "";

      if (/^https?:\/\//i.test(text)) {
        type = "🌐 Website / Link";
        linkHtml = `<a href="${text}" target="_blank">Link Kholain</a>`;
      } else if (/^mailto:/i.test(text) || /^[\w.-]+@[\w.-]+\.\w+$/.test(text)) {
        type = "📧 Email";
      } else if (/^tel:/i.test(text) || /^\+?\d{7,15}$/.test(text)) {
        type = "📞 Phone Number";
      } else if (/^WIFI:/i.test(text)) {
        type = "📶 WiFi Network";
      } else if (/^upi:\/\//i.test(text)) {
        type = "💳 UPI Payment";
      }

      vibrateSuccess();
      document.getElementById('modalType').innerText = type;
      document.getElementById('modalContent').innerText = text;
      document.getElementById('modalLink').innerHTML = linkHtml;
      document.getElementById('modalOverlay').style.display = "flex";
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = "none";
      isPaused = false;
    }

    function onScanSuccess(decodedText) {
      if (isPaused) return;
      isPaused = true;
      analyzeQR(decodedText);
    }

    async function startCamera() {
      if (cameraRunning) return;
      try {
        await html5QrCode.start(
          { facingMode: { exact: "environment" } },
          { fps: 10, qrbox: 250 },
          onScanSuccess,
          () => {}
        );
        cameraRunning = true;
      } catch (err) {
        try {
          await html5QrCode.start(
            { facingMode: "user" },
            { fps: 10, qrbox: 250 },
            onScanSuccess,
            () => {}
          );
          cameraRunning = true;
        } catch (err2) {
          document.getElementById('modalType').innerText = "Camera Error";
          document.getElementById('modalContent').innerText = err2;
          document.getElementById('modalOverlay').style.display = "flex";
        }
      }
    }

    async function stopCamera() {
      if (!cameraRunning) return;
      try { await html5QrCode.stop(); } catch (e) {}
      cameraRunning = false;
    }

    const camModeBtn = document.getElementById('camModeBtn');
    const fileModeBtn = document.getElementById('fileModeBtn');
    const readerWrapper = document.getElementById('reader-wrapper');
    const fileBox = document.getElementById('fileBox');

    camModeBtn.addEventListener('click', async function() {
      if (currentMode === "camera") return;
      currentMode = "camera";
      camModeBtn.classList.add('active');
      fileModeBtn.classList.remove('active');
      fileBox.style.display = "none";
      readerWrapper.style.display = "block";
      await startCamera();
    });

    fileModeBtn.addEventListener('click', async function() {
      if (currentMode === "file") return;
      currentMode = "file";
      fileModeBtn.classList.add('active');
      camModeBtn.classList.remove('active');
      readerWrapper.style.display = "none";
      fileBox.style.display = "block";
      await stopCamera();
    });

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      html5QrCode.scanFile(file, true)
        .then(decodedText => {
          isPaused = true;
          analyzeQR(decodedText);
        })
        .catch(() => {
          document.getElementById('modalType').innerText = "Error";
          document.getElementById('modalContent').innerText = "Is image mein QR code nahi mila.";
          document.getElementById('modalOverlay').style.display = "flex";
        });
    });

    startCamera();
  </script>
</body>
</html>
